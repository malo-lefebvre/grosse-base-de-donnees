name: Synchroniser le dashboard

on:
  schedule:
    - cron: "17 * * * *" # toutes les heures (GitHub peut avoir quelques minutes de retard)
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]

permissions:
  contents: write # pour le commit qui garde la synchro active
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          cache-dependency-glob: sync/sync.py

      - name: Lire Notion et Readwise, puis chiffrer
        run: uv run sync/sync.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub met en pause les tâches planifiées d'un dépôt public sans activité depuis 60 jours.
      - name: Garder la synchro active
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Garder la synchro active"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
